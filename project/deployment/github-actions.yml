# LifeLink CI workflow template.
#
# GitHub ONLY discovers workflows at the repository root in .github/workflows/.
# This file is kept here for project organisation; install it with the exact
# command documented in project/docs/deployment/CI.md:
#
#   mkdir -p .github/workflows && cp project/deployment/github-actions.yml .github/workflows/lifelink-ci.yml
#
# The scan step intentionally FAILS the job on High/Critical findings while the
# SARIF upload always runs, so findings are reported and never silently hidden.

name: LifeLink CI

'on':
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Maven verify (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: project/backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend - build and test (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/frontend
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build

      - name: Run frontend tests
        run: npm test

  security:
    name: Trivy filesystem / dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Trivy scan (fails on High/Critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Publish scan results even when the scan fails
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lifelink}
    username: ${DATABASE_USER:lifelink}
    password: ${DATABASE_PASSWORD:lifelink}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration

# Production-shaped PostgreSQL deployments must opt in to demo data explicitly.
# The local Compose stack sets SEED_DEMO_DATA=true for its reproducible demo.
lifelink:
  seed:
    enabled: ${SEED_DEMO_DATA:false}
